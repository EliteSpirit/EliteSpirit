name: Generate Constellation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate constellation SVG
        env:
          GH_TOKEN: ${{ secrets.CONSTELLATION_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-constellation.js

      - name: Deploy to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output || git checkout output
          git rm -rf . || true
          git checkout main -- dist
          mv dist/* .
          rm -rf dist scripts .github
          git add -A
          git commit -m "Update constellation" || echo "No changes"
          git push origin output --force
